<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>  Login  </title>


    <style>
        body { font-family: Arial; margin: 50px; }
        .error { color: red; }
    </style>
</head>

<body>
    <h2>Вход в систему</h2>
    <form id="loginForm">
        <input type="text" id="username" placeholder="Логин" required><br><br>
        <input type="password" id="password" placeholder="Пароль" required><br><br>
        <button type="submit">Войти</button>
    </form>
    <div id="error" class="error"></div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();

            var username = document.getElementById('username').value;
            var password = document.getElementById('password').value;

            fetch('/api/auth/login/', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({username: username, password: password})
            })
            .then(function(response) {
                if (response.ok) {
                    return response.json();
                } else {
                    throw new Error('Ошибка входа');
                }
            })
            .then(function(data) {
                localStorage.setItem('access_token', data.access);
                localStorage.setItem('refresh_token', data.refresh);
                window.location.href = '/defects/';
            })
            .catch(function() {
                document.getElementById('error').textContent = 'Ошибка входа';
            });
        });
    </script>
</body>
</html>
